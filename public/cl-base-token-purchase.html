<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>CL-Base Token 购买</title>

  <link
    rel="stylesheet"
    href="/css/cl-base-token-purchase.css"
  >

  <script
    src="/js/cl-base-token-purchase.js"
    defer
  ></script>
</head>

<body>
  <div class="purchase-shell">
    <header class="purchase-header">
      <a
        class="back-link"
        href="/aigc-workspace.html"
      >
        ← 返回 CL-Base 工作空间
      </a>

      <span class="platform-label">
        HARSON-BASE
      </span>

      <h1>Token 购买</h1>

      <p>
        购买 Token 后，可用于 CL-Base
        图片、视频和其他 AIGC 功能。
      </p>
    </header>

    <main class="purchase-main">
      <section class="balance-card">
        <div>
          <span class="section-label">
            当前 Token 余额
          </span>

          <div class="balance-value">
            <span
              class="token-icon"
              aria-hidden="true"
            >
              ⚡
            </span>

            <strong id="currentTokenBalance">
              --
            </strong>
          </div>
        </div>

        <button
          class="details-button"
          type="button"
          disabled
        >
          Token 明细
        </button>
      </section>

      <section class="package-section">
        <div class="section-heading">
          <div>
            <span class="section-label">
              选择购买套餐
            </span>

            <h2>Token 加油包</h2>
          </div>

          <span class="temporary-badge">
            测试页面
          </span>
        </div>

        <div class="package-grid">
          <button
            class="package-card"
            type="button"
            data-token="100"
            data-price="10"
          >
            <span class="package-token">
              <span
                class="package-token-icon"
                aria-hidden="true"
              >
                ⚡
              </span>

              <span>100</span>
            </span>

            <span class="package-price">
              ¥10
            </span>
          </button>

          <button
            class="package-card"
            type="button"
            data-token="500"
            data-price="50"
          >
            <span class="package-token">
              <span
                class="package-token-icon"
                aria-hidden="true"
              >
                ⚡
              </span>

              <span>500</span>
            </span>

            <span class="package-price">
              ¥50
            </span>
          </button>

          <button
            class="package-card"
            type="button"
            data-token="1000"
            data-price="100"
          >
            <span class="package-token">
              <span
                class="package-token-icon"
                aria-hidden="true"
              >
                ⚡
              </span>

              <span>1,000</span>
            </span>

            <span class="package-price">
              ¥100
            </span>
          </button>

          <button
            class="package-card"
            type="button"
            data-token="2100"
            data-price="200"
          >
            <span class="package-token">
              <span
                class="package-token-icon"
                aria-hidden="true"
              >
                ⚡
              </span>

              <span>2,000</span>

              <small>+100</small>
            </span>

            <span class="package-price">
              ¥200
            </span>
          </button>

          <button
            class="package-card"
            type="button"
            data-token="5250"
            data-price="500"
          >
            <span class="package-token">
              <span
                class="package-token-icon"
                aria-hidden="true"
              >
                ⚡
              </span>

              <span>5,000</span>

              <small>+250</small>
            </span>

            <span class="package-price">
              ¥500
            </span>
          </button>

          <button
            class="package-card selected"
            type="button"
            data-token="11000"
            data-price="1000"
          >
            <span class="package-token">
              <span
                class="package-token-icon"
                aria-hidden="true"
              >
                ⚡
              </span>

              <span>10,000</span>

              <small>+1,000</small>
            </span>

            <span class="package-price">
              ¥1,000
            </span>
          </button>
        </div>
      </section>

      <section class="payment-section">
        <label class="agreement-row">
          <input
            id="agreementCheckbox"
            type="checkbox"
          >

          <span>
            我已阅读并同意用户服务协议、
            付费服务协议和隐私政策
          </span>
        </label>

        <div class="payment-summary">
          <div>
            <span>本次购买</span>

            <strong id="selectedToken">
              11,000 Token
            </strong>
          </div>

          <div>
            <span>应付金额</span>

            <strong id="selectedPrice">
              ¥1,000
            </strong>
          </div>

          <button
            id="testPaymentButton"
            class="payment-button"
            type="button"
          >
            确认购买
          </button>
        </div>

        <p class="payment-notice">
          当前为前端测试页面，尚未接入支付宝、
          微信支付或真实 Token 充值接口。
        </p>
      </section>
    </main>
  </div>
</body>
</html>
