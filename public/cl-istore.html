<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>CL-iStore | Harson-Base</title>

  <link
    rel="stylesheet"
    href="/css/main.css"
  />

  <link
    rel="stylesheet"
    href="/css/cl-istore.css"
  />
</head>

<body class="cl-istore-page">

  <main class="istore-main">

    <div class="istore-container">
        <header class="istore-header">

            <div class="istore-title-row">

                <a
                    href="/"
                    class="istore-back"
                    aria-label="返回 Harson-Base"
                    title="返回 Harson-Base"
                    >
                    ←
                </a>

                <div class="istore-title-copy">

                    <h1>
                        CL-iStore
                    </h1>

                </div>

            </div>

        </header>
      

      <section class="istore-menu">

        <a
          href="#"
          class="istore-menu-item"
          id="footScannerEntry"
        >

          <div class="istore-menu-content">

            <div class="istore-menu-icon">
              <i class="fas fa-shoe-prints"></i>
            </div>

            <div class="istore-menu-text">

              <h2>
                足测仪
              </h2>

              <p>
                足部测量、设备数据采集与尺码分析
              </p>

            </div>

          </div>

          <div class="istore-menu-action">
            <span>
              进入
            </span>

            <span class="istore-arrow">
              →
            </span>
          </div>

        </a>


        <a
          href="#"
          class="istore-menu-item"
          id="storeAnalyticsEntry"
        >

          <div class="istore-menu-content">

            <div class="istore-menu-icon">
              <i class="fas fa-chart-column"></i>
            </div>

            <div class="istore-menu-text">

              <h2>
                客流分析与巡店管理
              </h2>

              <p>
                门店客流、巡店任务与运营数据管理
              </p>

            </div>

          </div>

          <div class="istore-menu-action">

            <span>
              进入
            </span>

            <span class="istore-arrow">
              →
            </span>

          </div>

        </a>

      </section>

    </div>

  </main>

</body>
</html>
