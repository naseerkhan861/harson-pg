<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>HARSON 3D Shoe Test</title>

  <script
    type="module"
    src="/js/vendor/model-viewer.min.js"
  ></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      background:
        radial-gradient(
          circle at center,
          #263238 0%,
          #17202a 45%,
          #0b0f15 100%
        );
      overflow: hidden;
      font-family:
        "PingFang SC",
        "Microsoft YaHei",
        sans-serif;
    }

    .viewer-page {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    model-viewer {
      width: min(1100px, 95vw);
      height: min(780px, 88vh);
      background: transparent;
      --poster-color: transparent;
    }

    .viewer-tip {
      position: absolute;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%);

      padding: 10px 18px;

      color: #ffc107;
      font-size: 13px;
      letter-spacing: 1px;

      border: 1px solid rgba(255, 193, 7, 0.4);
      background: rgba(8, 12, 18, 0.75);
      backdrop-filter: blur(8px);
    }
  </style>
</head>

<body>

  <main class="viewer-page">

    <model-viewer
      src="/models/hero/harson-male-loafer-web.glb"
      alt="HARSON 男鞋 3D 模型"

      camera-controls
      auto-rotate
      rotation-per-second="18deg"

      shadow-intensity="1"
      shadow-softness="0.8"

      exposure="1"

      interaction-prompt="auto"
      touch-action="pan-y">
    </model-viewer>

    <div class="viewer-tip">
      拖动旋转 · 滚轮缩放
    </div>

  </main>

</body>
</html>
