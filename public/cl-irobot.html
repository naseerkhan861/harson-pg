<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CL-iRobot | Harson-Base</title>
  <link rel="stylesheet" href="/css/main.css" />
  <!-- 复用现有 iStore 二级页面布局、响应式设计及悬停效果 -->
  <link rel="stylesheet" href="/css/cl-istore.css" />
  <!-- iRobot 只覆盖背景图，不改动 iStore 原页面 -->
  <link rel="stylesheet" href="/css/cl-irobot.css" />
</head>
<body class="cl-istore-page cl-irobot-page">
  <main class="istore-main">
    <div class="istore-container">
      <header class="istore-header">
        <div class="istore-title-row">
          <a href="/" class="istore-back" aria-label="返回 Harson-Base" title="返回 Harson-Base">←</a>
          <div class="istore-title-copy"><h1>CL-iRobot</h1></div>
        </div>
      </header>

      <section class="istore-menu" aria-label="CL-iRobot 功能入口">
        <!-- 下游功能尚未接入，因此使用 article 避免跳转到不存在的页面 -->
        <article class="istore-menu-item" id="irobotGreeterEntry">
          <div class="istore-menu-content">
            <div class="istore-menu-text">
              <h2>迎宾导购</h2>
              <p>智能迎宾、语音交互与自主导航导购</p>
            </div>
          </div>
          <div class="istore-menu-action">
            <span>进入</span>

            <span class="istore-arrow">
              →
            </span>
          </div>
        </article>

        <article class="istore-menu-item" id="irobotInventoryEntry">
          <div class="istore-menu-content">
            <div class="istore-menu-text">
              <h2>库存判断</h2>
              <p>智能巡检、库存状态识别与异常预警</p>
            </div>
          </div>
          <div class="istore-menu-action">
            <span>进入</span>

            <span class="istore-arrow">
              →
            </span>
          </div>
        </article>

        <article class="istore-menu-item" id="irobotVisionEntry">
          <div class="istore-menu-content">
            <div class="istore-menu-text">
              <h2>视觉分析</h2>
              <p>机器人视觉感知、目标识别与场景分析</p>
            </div>
          </div>
          <div class="istore-menu-action">
            <span>进入</span>

            <span class="istore-arrow">
              →
            </span>
          </div>
        </article>
      </section>
    </div>
  </main>
</body>
</html>
